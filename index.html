<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ресторан «Москвичка» | Новосибирск</title>
    
    <!-- Подключение шрифтов -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #0c0808;
            --bg-card: #150f10;
            --bg-card-alt: #1c1415;
            --terracotta: #8C2D27;
            --terracotta-bright: #B83B32;
            --emerald: #132A24;
            --emerald-light: #1D3F37;
            --gold: #D4AF37;
            --gold-light: #F3E5AB;
            --text-main: #F5EBE6;
            --text-muted: #A39691;
            --border: rgba(212, 175, 55, 0.18);
            --font-head: 'Cormorant Garamond', serif;
            --font-body: 'Manrope', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: var(--font-body);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, .font-head { font-family: var(--font-head); font-weight: 600; }

        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* HEADER */
        header {
            position: fixed;
            top: 0; left: 0; width: 100%;
            z-index: 1000;
            background: rgba(12, 8, 8, 0.92);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
        }

        .header-wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 85px;
        }

        .logo {
            font-family: var(--font-head);
            font-size: 2.2rem;
            color: var(--terracotta-bright);
            font-style: italic;
            text-decoration: none;
            font-weight: 700;
        }

        .logo span {
            color: var(--gold);
            font-size: 0.85rem;
            font-style: normal;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-left: 8px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 32px;
        }

        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: color 0.3s;
        }

        .nav-links a:hover { color: var(--gold); }

        /* «ФИЗИКА» КНОПОК И ИНТЕРАКТИВ */
        .btn-header, .btn-main, .btn-outline, .tab-btn {
            position: relative;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-header:active, .btn-main:active, .btn-outline:active, .tab-btn:active {
            transform: scale(0.95) !important;
        }

        .btn-header {
            background: var(--terracotta);
            color: #fff;
            padding: 12px 24px;
            text-decoration: none;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-radius: 4px;
            border: 1px solid transparent;
        }

        .btn-header:hover {
            background: var(--terracotta-bright);
            box-shadow: 0 4px 20px rgba(184, 59, 50, 0.4);
            transform: translateY(-2px);
        }

        /* HERO SECTION */
        .hero {
            min-height: 95vh;
            padding-top: 160px;
            padding-bottom: 80px;
            background: linear-gradient(to bottom, rgba(12, 8, 8, 0.65), rgba(12, 8, 8, 0.95)), 
                        url('photo_2026-11-02_20-54-06.jpg') center/cover no-repeat fixed;
            display: flex;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .hero-tag {
            color: var(--gold);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 24px;
            display: inline-block;
            border-bottom: 1px solid var(--gold);
            padding-bottom: 4px;
        }

        .hero h1 {
            font-size: 4.8rem;
            line-height: 1.05;
            margin-bottom: 24px;
        }

        .hero h1 em { color: var(--terracotta-bright); font-style: italic; }

        .hero-desc {
            max-width: 720px;
            margin: 0 auto 40px;
            color: var(--text-muted);
            font-size: 1.15rem;
            font-weight: 300;
        }

        .hero-btns {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn-main {
            background: linear-gradient(135deg, var(--terracotta), var(--terracotta-bright));
            color: #fff;
            padding: 16px 36px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 4px;
            border: none;
            box-shadow: 0 4px 15px rgba(140, 45, 39, 0.3);
        }

        .btn-main:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(184, 59, 50, 0.5);
        }

        .btn-outline {
            border: 1px solid var(--gold);
            color: var(--text-main);
            padding: 16px 36px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.9rem;
            border-radius: 4px;
            background: transparent;
        }

        .btn-outline:hover {
            background: var(--gold);
            color: var(--bg-main);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3);
        }

        /* HIGHLIGHTS */
        .features {
            padding: 80px 0;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
        }

        .feat-box {
            background: rgba(255, 255, 255, 0.02);
            padding: 36px 28px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .feat-box h3 {
            font-size: 1.8rem;
            color: var(--gold-light);
            margin-bottom: 14px;
        }

        .feat-box p { color: var(--text-muted); font-size: 0.95rem; }

        /* CONCEPT SECTION */
        .concept-sec {
            padding: 120px 0;
            background: var(--bg-main);
        }

        .concept-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .concept-text h3 {
            font-size: 2.8rem;
            color: var(--terracotta-bright);
            margin-bottom: 20px;
        }

        .concept-text p {
            color: var(--text-muted);
            margin-bottom: 20px;
            font-size: 1.05rem;
        }

        /* MENU SECTION */
        .menu-sec {
            padding: 120px 0;
            background: var(--bg-card-alt);
        }

        .section-hdr {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-subtitle {
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.85rem;
            margin-bottom: 10px;
            display: block;
        }

        .section-title {
            font-size: 3.5rem;
            color: var(--text-main);
        }

        .menu-tabs {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 12px 28px;
            border-radius: 30px;
            font-family: var(--font-body);
            font-size: 0.9rem;
        }

        .tab-btn:hover {
            color: var(--gold-light);
            border-color: var(--gold);
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: var(--emerald);
            color: var(--gold-light);
            border-color: var(--gold);
            box-shadow: 0 4px 20px rgba(19, 42, 36, 0.6);
        }

        .menu-items-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            min-height: 380px;
        }

        .menu-item-card {
            background: var(--bg-card);
            padding: 28px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .item-details h4 {
            font-size: 1.45rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .item-details p {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 300;
        }

        .item-cost {
            font-family: var(--font-head);
            font-size: 1.6rem;
            color: var(--gold);
            font-weight: 600;
            white-space: nowrap;
            margin-left: 15px;
        }

        /* GALLERY SECTION */
        .gallery-sec {
            padding: 120px 0;
            background: var(--bg-main);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .gallery-card {
            height: 380px;
            border-radius: 8px;
            position: relative;
            background-size: cover;
            background-position: center;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: transform 0.4s ease;
        }

        .gallery-card:hover {
            transform: translateY(-5px);
        }

        .gallery-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(12, 8, 8, 0.85), transparent 60%);
        }

        .gallery-title {
            position: absolute;
            bottom: 24px;
            left: 24px;
            z-index: 2;
            font-family: var(--font-head);
            font-size: 1.6rem;
            color: var(--gold-light);
        }

        /* BOOKING SECTION */
        .booking-sec {
            padding: 120px 0;
            background: linear-gradient(135deg, rgba(19, 42, 36, 0.9), rgba(10, 23, 19, 0.95)), 
                        url('photo_2026-11-02_20-54-02.jpg') center/cover no-repeat fixed;
            border-top: 1px solid var(--border);
        }

        .booking-box {
            max-width: 760px;
            margin: 0 auto;
            text-align: center;
        }

        .booking-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 40px;
            background: rgba(1
